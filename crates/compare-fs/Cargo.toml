[package]
name = "compare-fs"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
compare-text = { path = "../compare-text" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tempfile = "=3.27.0"
globset = "=0.4.20"
blake3 = { version = "=1.8.7", features = ["pure"] }
trash = "=5.2.9"
crc32fast = "=1.5.2"
unicode-normalization = "=0.1.25"
rayon = "=1.12.0"

[target."cfg(windows)".dependencies]
winreg = "=0.56.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }
